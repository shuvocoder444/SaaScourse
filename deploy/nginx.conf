# Nginx Configuration for Multi-Tenant Course/LMS SaaS Platform
# Upstream to Django WSGI / ASGI (Gunicorn / Uvicorn)

upstream django_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirection
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. Platform Main Domain & Wildcard Subdomain HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saascourse.com *.saascourse.com;

    # Wildcard SSL Certificate (Managed via Certbot with DNS-01 challenge)
    ssl_certificate /etc/letsencrypt/live/saascourse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saascourse.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Static Assets Cache
    location /static/ {
        alias /var/www/saascourse/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media Uploads (Course thumbnails, instructor avatars)
    location /media/ {
        alias /var/www/saascourse/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy to Django Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;

        # Critical Multi-Tenant Headers: Preserves exact incoming Host
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HTMX SSE Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}

# 3. Dynamic Custom Domain Reverse Proxy (CNAME Mapping)
# If using Nginx instead of Caddy for custom domains, OpenResty/Lua or Cloudflare for SaaS is recommended.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Fallback or OpenResty dynamically-loaded certificate
    ssl_certificate /etc/ssl/certs/default_fallback.crt;
    ssl_certificate_key /etc/ssl/private/default_fallback.key;

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
