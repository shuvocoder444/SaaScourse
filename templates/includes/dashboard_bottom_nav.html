<!-- Native Mobile Studio App Bottom Navigation Bar (Visible on Mobile/Tablet for Dashboard) -->
<nav 
  x-data="{
    activeTab: new URLSearchParams(window.location.search).get('tab') || 'overview'
  }"
  @switch-tab.window="activeTab = $event.detail"
  class="fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-950/98 backdrop-blur-2xl border-t border-slate-200/90 dark:border-slate-800 shadow-[0_-4px_25px_rgba(0,0,0,0.08)] lg:hidden select-none transition-all duration-200"
  style="padding-bottom: max(env(safe-area-inset-bottom, 0px), 6px);"
  aria-label="Dashboard Mobile Dock"
>
  <div class="grid grid-cols-5 items-center h-15 px-2 max-w-md mx-auto">
    
    <!-- 1. Overview Tab -->
    <a 
      href="{% url 'dashboard' %}?tab=overview" 
      @click="
        if (window.location.pathname.startsWith('/dashboard')) {
          $event.preventDefault();
          activeTab = 'overview';
          $dispatch('switch-tab', 'overview');
          history.pushState(null, '', '{% url 'dashboard' %}?tab=overview');
        }
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'overview' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-chart-pie text-base leading-none"></i>
        <span 
          x-show="activeTab === 'overview'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">ওভারভিউ</span>
    </a>

    <!-- 2. Courses Tab -->
    <a 
      href="{% url 'dashboard' %}?tab=courses" 
      @click="
        if (window.location.pathname.startsWith('/dashboard')) {
          $event.preventDefault();
          activeTab = 'courses';
          $dispatch('switch-tab', 'courses');
          history.pushState(null, '', '{% url 'dashboard' %}?tab=courses');
        }
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'courses' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-graduation-cap text-base leading-none"></i>
        <span 
          x-show="activeTab === 'courses'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">কোর্সসমূহ</span>
    </a>

    <!-- 3. Finance / Ledger Tab -->
    <a 
      href="{% url 'dashboard' %}?tab=finance" 
      @click="
        if (window.location.pathname.startsWith('/dashboard')) {
          $event.preventDefault();
          activeTab = 'finance';
          $dispatch('switch-tab', 'finance');
          history.pushState(null, '', '{% url 'dashboard' %}?tab=finance');
        }
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'finance' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-wallet text-base leading-none"></i>
        <span 
          x-show="activeTab === 'finance'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">আয়-ব্যয়</span>
    </a>

    <!-- 4. Students Tab -->
    <a 
      href="{% url 'dashboard' %}?tab=students" 
      @click="
        if (window.location.pathname.startsWith('/dashboard')) {
          $event.preventDefault();
          activeTab = 'students';
          $dispatch('switch-tab', 'students');
          history.pushState(null, '', '{% url 'dashboard' %}?tab=students');
        }
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'students' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-users text-base leading-none"></i>
        <span 
          x-show="activeTab === 'students'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">শিক্ষার্থী</span>
    </a>

    <!-- 5. All Menus / Studio Sidebar Trigger (ONLY THIS OPENS SIDEBAR) -->
    <button 
      type="button" 
      @click="$dispatch('toggle-sidebar')"
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-800 dark:text-slate-100 hover:text-brand-primary dark:hover:text-emerald-400 cursor-pointer"
    >
      <div class="relative w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-sm group-hover:bg-brand-primary group-hover:text-white transition-colors">
<i class="fa-solid fa-bars text-sm"></i>
      </div>
      <span class="text-[10px] tracking-tight mt-0.5 font-bold">সকল মেনু</span>
    </button>

  </div>
</nav>
