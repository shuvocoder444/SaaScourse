<!-- Native Student Dashboard Bottom Navigation Dock (Visible on Mobile/Tablet) -->
<nav 
  x-data="{
    activeTab: new URLSearchParams(window.location.search).get('tab') || '{{ active_tab|default:'overview' }}'
  }"
  @switch-tab.window="activeTab = $event.detail"
  class="fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-950/98 backdrop-blur-2xl border-t border-slate-200/90 dark:border-slate-800 shadow-[0_-4px_25px_rgba(0,0,0,0.08)] lg:hidden select-none transition-all duration-200"
  style="padding-bottom: max(env(safe-area-inset-bottom, 0px), 6px);"
  aria-label="Student Dashboard Mobile Dock"
>
  <div class="grid grid-cols-5 items-center h-15 px-2 max-w-md mx-auto">
    
    <!-- 1. Overview Tab -->
    <a 
      href="?tab=overview" 
      @click.prevent="
        activeTab = 'overview';
        $dispatch('switch-tab', 'overview');
        history.pushState(null, '', '?tab=overview');
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'overview' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-chart-pie text-base leading-none"></i>
        <span 
          x-show="activeTab === 'overview'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">ড্যাশবোর্ড</span>
    </a>

    <!-- 2. My Courses Tab -->
    <a 
      href="?tab=my_courses" 
      @click.prevent="
        activeTab = 'my_courses';
        $dispatch('switch-tab', 'my_courses');
        history.pushState(null, '', '?tab=my_courses');
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'my_courses' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-graduation-cap text-base leading-none"></i>
        <span 
          x-show="activeTab === 'my_courses'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">আমার কোর্স</span>
    </a>

    <!-- 3. Class Routine Tab -->
    <a 
      href="?tab=routine" 
      @click.prevent="
        activeTab = 'routine';
        $dispatch('switch-tab', 'routine');
        history.pushState(null, '', '?tab=routine');
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'routine' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-calendar-days text-base leading-none"></i>
        <span 
          x-show="activeTab === 'routine'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">রুটিন</span>
    </a>

    <!-- 4. Results & Exams Tab -->
    <a 
      href="?tab=results" 
      @click.prevent="
        activeTab = 'results';
        $dispatch('switch-tab', 'results');
        history.pushState(null, '', '?tab=results');
        $dispatch('close-sidebar');
      "
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-600 dark:text-slate-300 hover:text-slate-950 dark:hover:text-white cursor-pointer"
      :class="activeTab === 'results' ? 'text-brand-primary dark:text-emerald-400 font-black' : ''"
    >
      <div class="relative">
        <i class="fa-solid fa-square-poll-vertical text-base leading-none"></i>
        <span 
          x-show="activeTab === 'results'" 
          class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-brand-primary dark:bg-emerald-400"
        ></span>
      </div>
      <span class="text-[10px] tracking-tight mt-1 font-bold">ফলাফল</span>
    </a>

    <!-- 5. All Menus / Sidebar Trigger -->
    <button 
      type="button" 
      @click="$dispatch('toggle-sidebar')"
      class="flex flex-col items-center justify-center py-1 transition-transform active:scale-95 group text-slate-800 dark:text-slate-100 hover:text-brand-primary dark:hover:text-emerald-400 cursor-pointer"
    >
      <div class="relative w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-sm group-hover:bg-brand-primary group-hover:text-white transition-colors">
<i class="fa-solid fa-bars text-sm"></i>
      </div>
      <span class="text-[10px] tracking-tight mt-0.5 font-bold">সকল মেনু</span>
    </button>

  </div>
</nav>
